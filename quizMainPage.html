<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Main Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      height: 100vh;
      font-family: Arial, sans-serif;
      background-color: #fff;
    }

    #sidebar {
      width: 70px;
      background-color: #1e1f22;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between; 
      padding: 20px 0;
    }

    #sidebar #topNav {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    #sidebar #bottomNav {
      margin-bottom: 10px;
    }

    #sidebar a, #bottomNav a {
      color: white;
      font-size: 22px;
      text-decoration: none;
      transition: 0.3s;
    }

    #sidebar a:hover, #bottomNav a:hover {
      color: #00bfff;
      transform: scale(1.2);
    }

    .main {
      flex-grow: 1;
      background-color: #fff;
      border-left: 4px solid black;
      padding: 20px;
    }

    .quiz-header {
      margin-bottom: 30px;
      border-bottom: 2px solid #eee;
      padding-bottom: 15px;
    }

    .quiz-title {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .quiz-meta {
      font-size: 1rem;
      color: #555;
      margin-bottom: 10px;
    }

    .quiz-description {
      font-size: 1.1rem;
      color: #333;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="topNav">
      <a href="#" id="home"><i class="fa-solid fa-house"></i></a>
      <a href="#" id="create"><i class="fa-solid fa-plus"></i></a>
    </div>
    <div id="bottomNav">
      <a href="#" id="profile"><i class="fa-solid fa-user"></i></a>
    </div>
  </div>
  <div class="main">
    <div class="quiz-header">
      <div class="quiz-title" id="quizTitle">Quiz Title</div>
      <div class="quiz-meta">Created by <span id="quizCreator">Creator Name</span></div>
      <div class="quiz-description" id="quizDescription">This is a short description of the quiz.</div>
      <div class="quiz-questions-count" id="quizQuestionsCount">Število vprašanj: <span id="questionsCount">0</span></div>
    </div>
  </div>
  <script>
    var title = document.getElementById('quizTitle').innerText = "Primer kviza";
    var creator = document.getElementById('quizCreator').innerText = "Janez Novak";
    var description = document.getElementById('quizDescription').innerText = "To je opis kviza, ki ga je ustvaril uporabnik.";
    var questionsCount = document.getElementById('questionsCount').innerText = "5";

    document.getElementById('home').addEventListener('click', (e) => {
      e.preventDefault();
      window.api.sendNav('home');
    });

    document.getElementById('create').addEventListener('click', (e) => {
      e.preventDefault();
      window.api.sendNav('create');
    });

    document.getElementById('profile').addEventListener('click', (e) => {
      e.preventDefault();
      window.api.sendNav('profile');
    });
  </script>
</body>
</html>
