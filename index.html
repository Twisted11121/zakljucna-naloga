<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar Layout</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style/index.css">
  
</head>
<body>
  <div id="sidebar">
  <div id="topNav">
    <a href="#" id="home"><i class="fa-solid fa-house"></i></a>
    <a href="#" id="create"><i class="fa-solid fa-plus"></i></a>
  </div>
  <div id="bottomNav">
    <a href="#" id="profile"><i class="fa-solid fa-user"></i></a>
  </div>
</div>

  <div class="main">
      <div id="searchBar">
        <input type="text" id="searchInput" placeholder="Search...">
        <button id="searchButton">Search</button>
    </div>
    <div id="showAll" style="margin-top:100px;">
    </div>
  </div>
</body>

<script>

    const container = document.getElementById('showAll');

    // Load all content
    window.api.onSaveComplete((data) =>{
      console.log(data);
      if (data.success) {
        container.innerHTML = '';
        data.data.forEach(item => {
          const div = document.createElement('div');
          div.classList.add('content-item');
          div.id = `${item.id}`;

          div.onclick = () => {
            window.api.openContent(item.id);
          };

          div.innerHTML = `<h3>${item.name}</h3><p>${item.description}</p>`;
          container.appendChild(div);
        });
      }
    });


    // Search results
    window.api.onSearchResults((data) => {
      container.innerHTML = '';
      if (data.length === 0) {
        container.innerHTML = '<p>No results found.</p>';
        return;
      }
      data.forEach(item => {
        const div = document.createElement('div');
        div.classList.add('content-item');
        div.id = `${item.id}`;

        div.onclick = () => {
          window.api.openContent(item.id);
        };

        div.innerHTML = `<h3>${item.name}</h3><p>${item.description}</p>`;
        container.appendChild(div);
      });
    });

    

    // Button Click
    document.getElementById('searchButton').addEventListener('click', () => {
      const query = document.getElementById('searchInput').value;
      window.api.searchContent(query);
    });

    // Enter
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const query = document.getElementById('searchInput').value;
        window.api.searchContent(query);
      }
    });


    document.getElementById('home').addEventListener('click', (e) => {
    e.preventDefault();
    window.api.sendNav('home');
    });

    document.getElementById('create').addEventListener('click', (e) => {
    e.preventDefault();
    window.api.sendNav('create');
    });

    document.getElementById('profile').addEventListener('click', (e) => {
    e.preventDefault();
    window.api.sendNav('profile');
    });

</script>


</html>
